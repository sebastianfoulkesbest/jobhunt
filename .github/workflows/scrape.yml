name: Scrape jobs

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC (07:00 in Paris in winter)
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install a browser (only if a site in config.yaml uses render js)
        run: |
          if grep -Eq "^\s*-.*render:\s*js" config.yaml; then
            pip install playwright
            playwright install --with-deps chromium
          fi

      - name: Scrape
        run: python scraper.py

      - name: Save results
        run: |
          git config user.name "jobboard-bot"
          git config user.email "jobboard-bot@users.noreply.github.com"
          git add docs/jobs.json
          git diff --staged --quiet || git commit -m "Update postings $(date -u +%F)"
          git push
