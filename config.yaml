# Links containing any of these are ignored: menus, legal pages, and
# anything internship-related (you are looking for a job).
# Whole words only, so "intern" does not block "international".
exclude:
  - privacy policy
  - cookie
  - politique de confidentialite
  - mentions legales
  - terms of use
  - newsletter
  - sign in
  - log in
  - login
  - connexion
  - accessibility
  - accessibilite
  - "stage*"
  - "stagiaire*"
  - intern
  - interns
  - "internship*"
  - "trainee*"
  - "traineeship*"
  - "alternance*"
  - "apprenti*"
  - work study

# Sites to check. Only name and url are required. Optional per-site settings:
#   render: js          load the page in a real browser first (for sites that
#                       build their job list with JavaScript)
#   take_all: true      keep every link that looks like a job, ignoring keywords
#   match_context: true also look at the text around the link, not just the link
#   ignore_robots: true skip the robots.txt check (only for sites you are allowed
#                       to read automatically)
# The scraper respects robots.txt by default. Blocked sites show up as
# "blocked" in the Source status list on the board.
sites:
  - {name: OECD, url: "https://careers.smartrecruiters.com/OECD/oecd---en"}
